[project]
name = "calibre-semantic"
version = "0.1.0"
description = "Semantic search library for Calibre e-book manager"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.10"
authors = [
    { name = "Logan Rooks" }
]
keywords = ["calibre", "semantic-search", "ebooks", "embeddings", "vector-search"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Indexing",
]

dependencies = [
    "numpy>=1.24.0",
]

[project.optional-dependencies]
# Embedding providers
sentence-transformers = [
    "sentence-transformers>=2.2.0",
    "torch>=2.0.0",
]
openai = [
    "openai>=1.0.0",
]
ollama = [
    "ollama>=0.1.0",
]
voyageai = [
    "voyageai>=0.1.0",
]

# Vector store backends
sqlite-vec = [
    "sqlite-vec>=0.1.0",
]
chromadb = [
    "chromadb>=0.4.0",
]
faiss = [
    "faiss-cpu>=1.7.0",
]

# All embedding providers
all-embeddings = [
    "calibre-semantic[sentence-transformers,openai,ollama,voyageai]",
]

# All vector stores
all-vectordb = [
    "calibre-semantic[sqlite-vec,chromadb,faiss]",
]

# Development dependencies
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

# Full installation
all = [
    "calibre-semantic[all-embeddings,all-vectordb,dev]",
]

[project.urls]
Homepage = "https://github.com/loganrooks/semantic-calibre"
Repository = "https://github.com/loganrooks/semantic-calibre"
Issues = "https://github.com/loganrooks/semantic-calibre/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["calibre_semantic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["calibre_semantic"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = [
    "sentence_transformers.*",
    "torch.*",
    "chromadb.*",
    "faiss.*",
    "calibre.*",
]
ignore_missing_imports = true
